[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structguard"
version = "4.6.1"
description = "StructGuard 4.6.1 Professional ES: analizador heurístico, contract lint y checker acotado para estructuras de datos C++17, con perfiles de análisis, reportes enriquecidos, CI, modo Clang AST opcional, fuzzing abstracto y backend formal experimental."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "StructGuard Project"}]
keywords = ["bounded-checking", "heuristic-analysis", "data-structures", "cpp", "contracts", "benchmarks", "fuzzing", "security", "ci", "dsl", "frontend"]
dependencies = []

[project.optional-dependencies]
z3 = ["z3-solver>=4.12"]

dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
structguard = "structguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
check_untyped_defs = false
follow_imports = "skip"
files = ["src/structguard"]
disable_error_code = ["var-annotated", "arg-type", "assignment", "index", "dict-item"]


[tool.setuptools.package-data]
structguard = ["schemas/*.json", "py.typed"]
