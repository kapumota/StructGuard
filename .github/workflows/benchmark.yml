name: StructGuard Benchmark

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar paquete con herramientas de desarrollo
        run: python -m pip install -e '.[dev]'

      - name: Ejecutar benchmark con umbrales
        run: |
          mkdir -p artifacts
          python benchmarks/run_benchmark.py \
            --output artifacts/benchmark-report.json \
            --thresholds benchmarks/thresholds.yml \
            --fail-on-threshold

      - name: Validar reporte de benchmark
        run: python scripts/check_benchmark_thresholds.py artifacts/benchmark-report.json

      - name: Subir reporte de benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structguard-benchmark-report
          path: |
            artifacts/benchmark-report.json
            artifacts/benchmark-cases/
            artifacts/generated_mutations/
