name: StructGuard CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y clang

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar paquete con herramientas de desarrollo
        run: python -m pip install -e '.[dev,z3]'

      - name: Verificar entorno
        run: |
          mkdir -p report
          structguard doctor . --json report/doctor.json

      - name: Ejecutar smoke test de usuario nuevo
        run: bash scripts/smoke_new_user.sh

      - name: Compilar fuentes de Python
        run: python -m compileall -q src tests

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Ejecutar lint crítico con Ruff
        run: ruff check .

      - name: Ejecutar verificación básica de tipos con mypy
        run: mypy

      - name: Ejecutar scan canónico y emitir artefactos
        run: |
          mkdir -p artifacts
          structguard scan examples/generic_cpp \
            --profile generic-cpp \
            --preset ci \
            --headers-only \
            --contract profiles/generic-cpp/contracts/stack.sgdsl \
            --report-json artifacts/report.json \
            --lockfile artifacts/structguard.lock
          structguard report derive artifacts/report.json \
            --sarif artifacts/structguard.sarif

      - name: Validar salidas de reportes
        run: |
          python -m json.tool artifacts/report.json > /dev/null
          python -m json.tool artifacts/structguard.sarif > /dev/null
          test -s artifacts/structguard.lock
          python scripts/validate_outputs.py --profile doctor

      - name: Subir reportes de StructGuard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structguard-reports
          path: |
            artifacts/
            report/doctor.json
